<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>BIM Pack · GLB 处理与查看</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ctext y='26' font-size='26' fill='%232b6cff'%3E%E2%97%88%3C/text%3E%3C/svg%3E" />
<link rel="stylesheet" href="./src/style.css" />
</head>
<body>

<!-- 顶栏 -->
<header class="topbar">
  <div class="brand">
    <span class="logo">◈</span>
    <span class="brand-name">BIM Pack</span>
    <span class="brand-sub">GLB 处理与查看</span>
  </div>

  <div class="file-info" id="fileInfo" hidden>
    <span class="file-name" id="fileName"></span>
    <span class="chip" id="chipSize"></span>
    <span class="chip" id="chipVerts"></span>
    <span class="chip" id="chipDraco"></span>
  </div>

  <div class="actions">
    <button class="btn ghost" id="btnTree" title="显示 / 隐藏左侧层级树（快捷键 1）" hidden>层级树</button>
    <button class="btn ghost" id="btnProps" title="显示 / 隐藏右侧构件属性（快捷键 2）" hidden>属性</button>
    <button class="btn ghost" id="btnOpen">打开文件</button>
    <button class="btn ghost" id="btnProcess" hidden>压缩处理</button>
    <button class="btn primary" id="btnDownload" hidden>下载 GLB</button>
  </div>
</header>

<!-- 主体 -->
<main class="layout no-left no-right" id="layout">

  <!-- 左：层级树 -->
  <aside class="panel left" id="panelLeft" hidden>
    <div class="panel-head">
      <span>模型层级</span>
      <span class="ph-right">
        <select class="ph-select" id="treeGroup" title="分组方式"></select>
        <span class="count" id="treeCount"></span>
        <button class="panel-x" id="btnCloseLeft" title="收起面板">×</button>
      </span>
    </div>
    <div class="tree-search">
      <input type="search" id="treeSearch" placeholder="搜索构件名称…" autocomplete="off" />
    </div>
    <div class="tree-body" id="tree"></div>
  </aside>

  <!-- 中：3D 视口 -->
  <section class="stage" id="stage">
    <canvas id="canvas"></canvas>

    <!-- 空状态 / 拖放区 -->
    <div class="dropzone" id="dropzone">
      <div class="dz-inner">
        <div class="dz-icon">⬡</div>
        <h1>把 .glb 拖进来</h1>
        <p class="dz-sub">或点击选择文件 —— 直接查看，也可以压缩后再看</p>
        <div class="dz-hint">
          <span>GLB / GLTF</span><span>Draco 已压缩也可</span><span>本地处理，不上传</span>
        </div>
      </div>
    </div>

    <!-- 处理进度 -->
    <div class="progress-card" id="progressCard" hidden>
      <div class="pc-head"><span id="pcTitle">处理中…</span><span class="pc-pct" id="pcPct"></span></div>
      <div class="pc-bar"><div class="pc-fill" id="pcFill"></div></div>
      <div class="pc-log" id="pcLog"></div>
    </div>

    <!-- 统计 HUD -->
    <div class="hud" id="hud" hidden>
      <div class="row"><span>Draw call</span><b id="hudDraw"></b></div>
      <div class="row"><span>三角面</span><b id="hudTri"></b></div>
      <div class="row"><span>构件</span><b id="hudParts"></b></div>
      <div class="row"><span>FPS</span><b id="hudFps"></b></div>
      <div class="row"><span>批处理</span><b id="hudBatch"></b></div>
    </div>

    <!-- 视图工具 -->
    <div class="view-tools" id="viewTools" hidden>
      <button class="vt-btn" id="btnFit" title="适应视图，看全整个模型（F）">适应视图</button>
      <button class="vt-btn" id="btnTop" title="俯视">俯视</button>
      <button class="vt-btn" id="btnGrid" title="地面网格">网格</button>
    </div>
  </section>

  <!-- 右：属性 -->
  <aside class="panel right" id="panelRight" hidden>
    <div class="panel-head">
      <span>构件属性</span>
      <span class="ph-right">
        <span class="count" id="propCount"></span>
        <button class="panel-x" id="btnCloseRight" title="收起面板">×</button>
      </span>
    </div>
    <div class="prop-body" id="props">
      <div class="empty">在模型或左侧树里点选一个构件</div>
    </div>
  </aside>
</main>

<input type="file" id="fileInput" accept=".glb,.gltf" hidden />
<div class="toast-wrap" id="toastWrap"></div>

<script type="module" src="./src/main.js"></script>
</body>
</html>
