<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>BIM 处理台 · 上传即处理</title>
<style>
  :root{--bg:#f2f4f8;--card:#fff;--line:#dde2ea;--text:#1a2130;--muted:#6b7688;--accent:#2b6cff;--ok:#0a8f4d;--warn:#c2410c}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);
       font:14px/1.6 system-ui,-apple-system,"Segoe UI","Microsoft YaHei",sans-serif}
  .wrap{max-width:860px;margin:0 auto;padding:38px 20px 80px}
  h1{font-size:20px;margin:0 0 6px;letter-spacing:.01em}
  .lead{color:var(--muted);margin:0 0 26px;font-size:13px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:0 2px 10px rgba(24,36,60,.05)}

  /* 拖放区 */
  #drop{padding:46px 24px;text-align:center;cursor:pointer;transition:.18s;border:2px dashed var(--line);background:#fbfcfe}
  #drop:hover,#drop.hot{border-color:var(--accent);background:#f4f8ff}
  #drop .big{font-size:15px;font-weight:600;margin-bottom:4px}
  #drop .sub{color:var(--muted);font-size:12.5px}
  #drop .ico{font-size:26px;opacity:.55;margin-bottom:8px}
  #file{display:none}

  /* 选项 */
  .opts{display:flex;flex-wrap:wrap;gap:18px;align-items:center;padding:12px 18px;border-top:1px solid var(--line);font-size:13px;color:var(--muted)}
  .opts label{display:flex;align-items:center;gap:7px;cursor:pointer}
  select{border:1px solid var(--line);border-radius:7px;padding:4px 8px;font:inherit;background:#fff;color:var(--text)}

  /* 进度 */
  #stage{display:none;margin-top:18px}
  .bar{height:6px;background:#e6ebf3;border-radius:4px;overflow:hidden}
  .bar i{display:block;height:100%;width:0;background:var(--accent);transition:width .2s}
  .stat{display:flex;justify-content:space-between;font-size:12.5px;color:var(--muted);margin-top:7px}
  .stat b{color:var(--text);font-weight:600;font-variant-numeric:tabular-nums}

  /* 日志 */
  #log{margin:14px 0 0;background:#0f1420;color:#c9d4e4;border-radius:10px;padding:13px 15px;
       font:12px/1.65 ui-monospace,SFMono-Regular,Consolas,monospace;max-height:320px;overflow:auto;white-space:pre-wrap;word-break:break-all}
  #log .ok{color:#5be08a}#log .bad{color:#ff8b7a}#log .dim{color:#7b8aa3}#log .hi{color:#7db4ff}

  /* 结果 */
  #result{display:none;margin-top:18px;padding:18px 20px}
  #result h2{font-size:15px;margin:0 0 3px}
  #result .muted{color:var(--muted);font-size:12.5px;margin-bottom:14px}
  .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(112px,1fr));gap:10px;margin-bottom:16px}
  .kpi{background:#f7f9fc;border:1px solid var(--line);border-radius:9px;padding:9px 11px}
  .kpi span{display:block;color:var(--muted);font-size:11.5px}
  .kpi b{font-size:15px;font-variant-numeric:tabular-nums}
  .btn{display:inline-block;background:var(--accent);color:#fff;border:0;border-radius:9px;padding:10px 20px;
       font:inherit;font-weight:600;cursor:pointer;text-decoration:none}
  .btn:hover{filter:brightness(1.06)}
  .btn.ghost{background:#fff;color:var(--text);border:1px solid var(--line);font-weight:500;padding:9px 16px}

  /* 历史 */
  h3{font-size:13px;color:var(--muted);font-weight:600;letter-spacing:.02em}
  #runs{display:grid;gap:8px}
  .run{display:flex;align-items:center;gap:14px;padding:11px 16px;font-size:13px}
  .run .nm{flex:1;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .run .meta{color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums}
  .empty{color:var(--muted);font-size:13px;padding:16px;text-align:center}
</style>
</head>
<body>
<div class="wrap">
  <h1>BIM 处理台</h1>
  <p class="lead">拖一个 .glb 进来，自动完成：修版本 → Draco 压缩 → 属性校验 → 几何保真检查 → 传输压缩。处理完直接点开看。</p>

  <div class="card">
    <div id="drop">
      <div class="ico">⇪</div>
      <div class="big">把 .glb 文件拖到这里</div>
      <div class="sub">或点击选择文件 · 单个文件 200 MB 以内都没问题</div>
    </div>
    <div class="opts">
      <label>压缩档位
        <select id="preset">
          <option value="auto" selected>自动（推荐）</option>
          <option value="high">高保真 16bit</option>
          <option value="balance">均衡 14bit</option>
          <option value="small">小体积 12bit</option>
        </select>
      </label>
      <label><input type="checkbox" id="geo" checked> 做几何保真检查（多约 10 秒）</label>
    </div>
    <input type="file" id="file" accept=".glb,.GLB">
  </div>

  <div id="stage">
    <div class="bar"><i id="bar"></i></div>
    <div class="stat"><span id="phase">准备中…</span><span><b id="pct">0%</b></span></div>
    <pre id="log"></pre>
  </div>

  <div class="card" id="result">
    <h2 id="rTitle">处理完成</h2>
    <div class="muted" id="rSub"></div>
    <div class="kpis" id="rKpis"></div>
    <a class="btn" id="rOpen" target="_blank">查看模型 →</a>
    <button class="btn ghost" id="rMore" style="margin-left:8px">再传一个</button>
  </div>

  <div style="display:flex;align-items:center;justify-content:space-between;margin:34px 0 10px">
    <h3 style="margin:0">已处理的楼层 <span id="runCount" style="color:#98a2b3;font-weight:400"></span></h3>
    <button class="btn ghost" id="btnRefresh" style="padding:4px 12px;font-size:12px">刷新</button>
  </div>
  <div class="card" id="runs"><div class="empty">加载中…</div></div>
</div>

<script>
const $ = (id) => document.getElementById(id);
const drop = $('drop'), fileInput = $('file'), log = $('log');
let busy = false;

const fmt = (n) => n >= 1048576 ? (n / 1048576).toFixed(2) + ' MB' : (n / 1024).toFixed(0) + ' KB';

// ---------- 交互 ----------
drop.onclick = () => { if (!busy) fileInput.click(); };
fileInput.onchange = () => { if (fileInput.files[0]) run(fileInput.files[0]); };
['dragenter', 'dragover'].forEach((e) => drop.addEventListener(e, (ev) => {
  ev.preventDefault(); drop.classList.add('hot');
}));
['dragleave', 'drop'].forEach((e) => drop.addEventListener(e, (ev) => {
  ev.preventDefault(); drop.classList.remove('hot');
}));
drop.addEventListener('drop', (ev) => {
  const f = [...(ev.dataTransfer?.files || [])].find((x) => /\.glb$/i.test(x.name));
  if (f) run(f); else alert('请拖入 .glb 文件');
});
$('rMore').onclick = () => reset();
$('rOpen').onclick = () => { /* target=_blank 已处理 */ };

function reset() {
  busy = false;
  $('stage').style.display = 'none';
  $('result').style.display = 'none';
  log.textContent = '';
  $('bar').style.width = '0';
  $('pct').textContent = '0%';
  fileInput.value = '';
  loadRuns();
}

// ---------- 主流程 ----------
async function run(file) {
  if (busy) return;
  busy = true;
  $('stage').style.display = 'block';
  $('result').style.display = 'none';
  log.textContent = '';

  try {
    // 1) 上传
    $('phase').textContent = `上传 ${file.name}（${fmt(file.size)}）`;
    const up = await upload(file, (loaded) => {
      const p = loaded / file.size;
      $('bar').style.width = (p * 45).toFixed(1) + '%';
      $('pct').textContent = (p * 100).toFixed(0) + '%';
    });
    addLog(`✓ 上传完成 ${up.name}  ${fmt(up.size)}`, 'ok');

    // 2) 处理
    $('phase').textContent = '正在处理：修版本 → Draco → 校验 → 预压缩';
    const { id } = await fetch('/api/build', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ file: up.file, preset: $('preset').value, geo: $('geo').checked }),
    }).then((r) => r.json());

    const job = await poll(id);
    if (job.status !== 'done') throw new Error('处理失败，见上方日志');

    $('bar').style.width = '100%';
    $('pct').textContent = '100%';
    $('phase').textContent = '完成';
    showResult(job.run);
  } catch (e) {
    $('phase').textContent = '出错了';
    addLog('✗ ' + e.message, 'bad');
    busy = false;
    loadRuns();
  }
}

function upload(file, onProgress) {
  return new Promise((resolve, reject) => {
    const xhr = new XMLHttpRequest();
    xhr.open('PUT', '/api/upload?name=' + encodeURIComponent(file.name));
    xhr.upload.onprogress = (e) => e.lengthComputable && onProgress(e.loaded);
    xhr.onload = () => {
      if (xhr.status !== 200) return reject(new Error('上传失败 ' + xhr.status));
      try { resolve(JSON.parse(xhr.responseText)); } catch { reject(new Error('上传响应异常')); }
    };
    xhr.onerror = () => reject(new Error('网络中断'));
    xhr.send(file);
  });
}

async function poll(id) {
  let seen = 0;
  for (;;) {
    await new Promise((r) => setTimeout(r, 600));
    const j = await fetch('/api/job/' + id).then((r) => r.json());
    for (; seen < j.lines.length; seen++) {
      const line = j.lines[seen];
      const cls = /✓/.test(line) ? 'ok' : /✗|失败/.test(line) ? 'bad' : /^ {2,}!/.test(line) ? 'dim' : /▶/.test(line) ? 'hi' : '';
      addLog(line, cls);
    }
    // 处理阶段占 45%→98%，按日志行数粗略推进（够用即可）
    if (j.status === 'running') {
      const p = Math.min(98, 45 + j.lines.length * 3);
      $('bar').style.width = p + '%';
      $('pct').textContent = p.toFixed(0) + '%';
    } else return j;
  }
}

function addLog(text, cls) {
  const span = document.createElement('span');
  if (cls) span.className = cls;
  span.textContent = text + '\n';
  log.appendChild(span);
  log.scrollTop = log.scrollHeight;
}

async function showResult(runName) {
  busy = false;
  const runs = await fetch('/api/runs').then((r) => r.json());
  const r = runs.find((x) => x.run === runName) || runs[0];
  if (!r) return;

  const s = r.stats || {};
  $('rTitle').textContent = r.title || r.run;
  $('rSub').textContent = `已生成 ${r.run}/${r.manifest?.model || ''}`;
  $('rKpis').innerHTML = [
    ['节点', (s.nodes || 0).toLocaleString()],
    ['三角面', (s.triangles || 0).toLocaleString()],
    ['draw call', s.drawCalls ?? '—'],
    ['文件', s.bytes ? fmt(s.bytes) : '—'],
    ['线上传输', s.bytesBrotli ? fmt(s.bytesBrotli) : '—'],
  ].map(([k, v]) => `<div class="kpi"><span>${k}</span><b>${v}</b></div>`).join('');
  $('rOpen').href = '/view?run=' + encodeURIComponent(r.run);
  $('result').style.display = 'block';
  loadRuns();
}

let lastSig = '';

function renderRun(r) {
  const when = new Date(r.at).toLocaleString('zh-CN', { hour12: false }).slice(5, 16);
  if (r.status !== 'ok') {
    return `<div class="run" style="opacity:.75">
      <span class="nm">${esc(r.title)}</span>
      <span class="meta" style="color:#c2410c">未完成 · ${esc(r.reason || '')}</span>
      <span class="meta">${when}</span>
      <button class="btn ghost" data-del="${esc(r.run)}"
        style="padding:3px 10px;font-size:12px;color:#c2410c;border-color:#f0c9b8">删除</button>
    </div>`;
  }
  const s = r.stats || {};
  return `<div class="run">
    <span class="nm">${esc(r.title || r.run)}</span>
    <span class="meta">${(s.primitives || 0).toLocaleString()} 构件 · ${s.drawCalls ?? '—'} draw call · ${s.bytesBrotli ? fmt(s.bytesBrotli) : '—'}</span>
    <span class="meta">${when}</span>
    <a class="btn ghost" href="/view?run=${encodeURIComponent(r.run)}" target="_blank">查看</a>
  </div>`;
}

async function loadRuns(force = false) {
  const box = $('runs');
  try {
    // 加时间戳 + no-store：双保险，避免浏览器/CDN 把列表缓存住
    const res = await fetch('/api/runs?t=' + Date.now(), { cache: 'no-store' });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const runs = await res.json();
    const sig = JSON.stringify(runs.map((r) => [r.run, r.at, r.status]));
    if (!force && sig === lastSig) return;      // 内容没变就不重绘，避免闪烁
    lastSig = sig;

    $('runCount').textContent = runs.length ? `（${runs.length}）` : '';
    if (!runs.length) {
      box.innerHTML = '<div class="empty">还没有处理过的楼层 —— 把 .glb 拖到上面就开始</div>';
      return;
    }
    box.innerHTML = runs.map(renderRun).join('');
    box.querySelectorAll('[data-del]').forEach((b) => {
      b.onclick = async () => {
        if (!confirm(`删除「${b.dataset.del}」的产物？原始上传文件不受影响。`)) return;
        await fetch('/api/runs/' + encodeURIComponent(b.dataset.del), { method: 'DELETE' });
        lastSig = '';
        loadRuns(true);
      };
    });
  } catch (e) {
    box.innerHTML = `<div class="empty">读取列表失败：${esc(e.message)}　
      <a href="#" onclick="location.reload();return false" style="color:#2b6cff">重开页面</a></div>`;
  }
}

const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

// 被从 /view?run=不存在 重定向回来时给个提示
const missing = new URLSearchParams(location.search).get('missing');
if (missing) {
  const tip = document.createElement('div');
  tip.className = 'card';
  tip.style.cssText = 'margin-bottom:16px;padding:12px 16px;border-color:#f0c9b8;background:#fff8f4;color:#c2410c;font-size:13px';
  tip.textContent = `找不到楼层「${missing}」，可能已被删除或处理未完成。请重新上传，或从下面列表里选一个。`;
  document.querySelector('.card').before(tip);
  history.replaceState(null, '', '/');
}

// 手动刷新
$('btnRefresh').onclick = () => { lastSig = ''; loadRuns(true); };

// 自动刷新：每 4 秒一次（处理中不打扰），切回标签页时立刻刷
setInterval(() => { if (!busy) loadRuns(); }, 4000);
document.addEventListener('visibilitychange', () => { if (!document.hidden) loadRuns(true); });
addEventListener('focus', () => loadRuns());

loadRuns(true);
</script>
</body>
</html>
